name: Cherry-pick YD-RP2040 support

on:
  workflow_dispatch:  # 手动触发

jobs:
  cherry-pick:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 获取完整历史，以便访问 79b0c67

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/micropython/micropython.git || true
          git fetch upstream

      - name: Create branch and cherry-pick
        run: |
          git checkout -b yd-rp2040
          git cherry-pick 79b0c67

      - name: Push branch
        run: |
          git push origin yd-rp2040
